<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Telegram WebApp</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      padding: 20px;
      margin: 0;
    }
    h3 {
      text-align: center;
      color: #333;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    input, select {
      width: 100%;
      padding: 8px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
    #result {
      margin-top: 20px;
      font-size: 18px;
      text-align: center;
      color: green;
    }
  </style>
</head>
<body>
  <h3>Калькулятор</h3>

  <div class="form-group">
    <label for="providerFee">Вознаграждение провайдера (%)</label>
    <input type="number" id="providerFee" placeholder="например, -1 или 3">
  </div>

  <div class="form-group">
    <label for="agentFee">Вознаграждение агента (%)</label>
    <input type="number" id="agentFee" placeholder="например, -2 или 5">
  </div>

  <div class="form-group">
    <label for="source">Источник курса</label>
    <select id="source"></select>
  </div>

  <div class="form-group">
    <label for="currencyFrom">Валюта источник</label>
    <select id="currencyFrom"></select>
  </div>

  <div class="form-group">
    <label for="currencyTo">Валюта получатель</label>
    <select id="currencyTo"></select>
  </div>

  <div class="form-group">
    <label for="comRatio">Накрутка на курс(%)</label>
    <input type="number" id="comRatio" placeholder="например, -2 или 5">
  </div>

  <div class="form-group">
    <label for="agentAmount">Сумма агента</label>
    <input type="number" id="agentAmount" placeholder="например, 10000">
  </div>

  <button onclick="calculate()">Рассчитать</button>

  <div id="result"></div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    async function loadDropdowns() {
      try {
        const [sourcesRes, currenciesRes] = await Promise.all([
          fetch("/api/load_sources"),
          fetch("/api/load_currencies")
        ]);

        const sourcesData = await sourcesRes.json();
        const currenciesData = await currenciesRes.json();

        console.log("Sources response:", sourcesData);
        console.log("Currencies response:", currenciesData);

        fillSelect("source", sourcesData.sources ?? sourcesData ?? []);
        fillSelect("currencyFrom", currenciesData.currencies ?? currenciesData ?? []);
        fillSelect("currencyTo", currenciesData.currencies ?? currenciesData ?? []);
      } catch (error) {
        console.error("Ошибка загрузки данных:", error);
        document.getElementById("result").textContent = "❌ Не удалось загрузить данные.";
      }
    }

    function fillSelect(id, items) {
      const select = document.getElementById(id);
      select.innerHTML = "";
      items.forEach(item => {
        const option = document.createElement("option");
        option.value = item;
        option.textContent = item;
        select.appendChild(option);
      });
    }

    function formatKZT(value) {
      return new Intl.NumberFormat("ru-RU", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2,
        useGrouping: true
      }).format(value) + " ₸";
    }

    async function calculate() {
      const source = document.getElementById("source").value;
      const currencyFrom = document.getElementById("currencyFrom").value;
      const currencyTo = document.getElementById("currencyTo").value;
      const agentFee = parseFloat(document.getElementById("agentFee").value);
      const providerFee = parseFloat(document.getElementById("providerFee").value);
      const agentAmount = parseFloat(document.getElementById("agentAmount").value);
      const comRatio = parseFloat(document.getElementById("comRatio").value);

  // Проверка
      if (!source || !currencyFrom || !currencyTo || isNaN(agentFee) || isNaN(providerFee) || isNaN(agentAmount) || isNaN(comRatio)) {
        document.getElementById("result").textContent = "❌ Заполните все поля!";
        return;
      }

      const payload = {
        exchangeSource: source,
        currencyFrom,
        currencyTo,
        comRatio,
        sumAgent: agentAmount,
        lowAgent: agentFee,
        lowPrv: providerFee
      };

      try {
        const res = await fetch("/api/get-rate-value", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
      });

      const result = await res.json();

      if (res.ok) {
        const incomeFormatted = formatKZT(result.income);
        const grossFormatted = formatKZT(result.gross_Income);

        document.getElementById("result").innerText =
          `💰 Доход: ${incomeFormatted}\n💸 Валовый Доход: ${grossFormatted}`;
      } else {
        document.getElementById("result").textContent = "❌ Ошибка: " + (result.error || "Неизвестная ошибка");
      }
      } catch (error) {
        document.getElementById("result").textContent = "❌ Ошибка запроса: " + error;
      }
    }

    loadDropdowns();
  </script>
</body>
</html>
